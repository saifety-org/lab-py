version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  default: standard
  exclusions:
    presets: []
    paths: []
    rules:
      # Human-readable diagnostics/progress retain best-effort output semantics.
      # JSON/SARIF output and data writes are still checked.
      - path: '^cmd/missed-injections/main\.go$'
        linters: [errcheck]
        text: 'Error return value of `fmt\.F(print|printf|println)` is not checked'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
