name: check
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: true
      - run: make lint
      - uses: actions/setup-go@v5
        with:
          go-version-file: research/go.mod
          cache: false
      - run: make research-check
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: true
      - run: make bootstrap
      - run: make bootstrap-context prepare-context
      - run: make bootstrap-encoder prepare-encoder
      - run: make test
        env:
          SAIFETY_BRIDGE: bin/model-bridge
          SAIFETY_CONTEXT_DATA: data/contextual
          SAIFETY_ENCODER_DATA: data/encoder
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: true
      - run: make build
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: true
      - run: uv sync --locked --extra ml
      - run: uv run --locked saifety-lab bootstrap --onnx
      - run: make bootstrap-encoder-onnx
      - run: make test-ml
        env:
          SAIFETY_BRIDGE: bin/model-bridge
          HF_HUB_OFFLINE: '1'
          HF_DATASETS_OFFLINE: '1'
  harness:
    name: harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked saifety-lab bootstrap-agent-harness
      - run: uv run --locked saifety-lab prepare-agent-harness
      - run: uv run --locked saifety-lab bootstrap-agent-harness --lock agent-harness-refusal-v2.sources.lock.json --out bin/agent-harness-refusal-v2
      - name: Validate Windows job plan without model requests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/run-device-job.ps1 -Plan
      - name: Test device runner gates without GPU or model requests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-device-job.ps1
      - run: uv run --locked pytest -m harness
        env:
          SAIFETY_HARNESS_REPORT: artifacts/agent-harness-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-harness-${{ matrix.os }}
          path: artifacts/agent-harness-ci/
          retention-days: 7
          if-no-files-found: warn
  research-lint:
    name: research lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: research/go.mod
          cache-dependency-path: research/go.sum
      - run: make fmt-check vet
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: research
          args: --config .golangci.yml ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: research
          args: --config .golangci.yml --build-tags onnx ./...
  research-test:
    name: research test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: research/go.mod
          cache-dependency-path: research/go.sum
      - run: make ci-test
  research-build:
    name: research build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: research/go.mod
          cache-dependency-path: research/go.sum
      - run: make ci-build
  research-windows:
    name: research collection (windows)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: research/go.mod
          cache-dependency-path: research/go.sum
      - run: go test -race ./cmd/context-collect ./internal/contextcollection
